# DISABLED: Pages, branch `main` kökünden yayınlanıyor (Settings → Pages → Deploy from a branch).
# Bu workflow her push'ta `npm ci` ile yeniden build etmeye çalışıyordu; package-lock
# senkronu bozulunca sürekli kırmızıya düşüyordu. Ayrıca GitHub'ın kendi
# `pages-build-deployment` akışı zaten statik dosyaları yayınlıyor.
#
# Canlı deploy akışı: yerelde `npm run build:pages` → pages-dist içeriğini
# repo köküne kopyala → push main. Çift deploy ve Actions şişkinliği yok.
#
# İleride Actions ile build istersen: lock dosyasını senkron tut, Pages source'u
# "GitHub Actions" yap ve bu dosyayı yeniden etkinleştir.

name: Deploy site to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Neden (manuel; varsayılan kapalı)"
        required: false
        default: "manual-only"

# push tetikleyicisi YOK — otomatik kırmızı koşular oluşmaz
permissions:
  contents: read

jobs:
  skip:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy workflow intentionally disabled
        run: |
          echo "Bu workflow bilinçli olarak devre dışı."
          echo "GitHub Pages: branch main / kök dizin."
          echo "Otomatik build-deploy yerine pages-build-deployment kullanılır."
